<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gán nhãn retrieval · Phase07</title>
<style>body{font:16px system-ui;margin:24px;background:#f5f6f3;color:#17221d}header{position:sticky;top:0;background:#f5f6f3;padding:12px 0;border-bottom:1px solid #ccd5cc;z-index:1}button,input,select{font:inherit;padding:7px;margin:4px;max-width:95%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{padding:14px;background:white;border:1px solid #d3dcd3;border-radius:12px}.card img{width:100%;height:220px;object-fit:contain}.clause{display:block;font-size:14px;margin:6px 0}#message{color:#a22;white-space:pre-wrap}small{overflow-wrap:anywhere}h1{font-size:24px}</style>
<header><h1>Gán nhãn relevance trên corpus thật</h1><p>Chấm độc lập theo nội dung ảnh; không có điểm CLIP hoặc thứ hạng model. 0: không liên quan · 1: một phần · 2: phù hợp rõ. Không suy absence từ thiếu tags.</p><label>Người đánh giá <input id="annotator" autocomplete="off"></label><label>Phiên bản nhãn <input id="version" value="human-v1"></label><label>Nạp bản nháp <input id="import" type="file" accept="application/json"></label><br><button id="previous">← Trước</button><select id="query"></select><button id="next">Sau →</button><button id="draft">Xuất bản nháp</button><label><input id="confirm" type="checkbox">Tôi đã xem và xác nhận đầy đủ các nhãn</label><button id="verified">Xuất nhãn đã xác nhận</button><p id="progress"></p><p id="message" role="alert"></p></header>
<main><h2 id="text"></h2><p id="task"></p><label><input id="noanswer" type="checkbox">Tôi xác nhận corpus không có đáp án relevant ở ngưỡng grade≥2</label><div id="reference"></div><div class="grid" id="images"></div></main>
<script>
const DATA=/*__DATA__*/;
let current=0;
let labels={schema_version:1,dataset_sha256:DATA.dataset_sha256,query_set_sha256:DATA.query_set_sha256,label_version:'human-v1',annotator:'',human_verified:false,exhaustive_judgments:false,binary_relevance_min_grade:2,queries:{}};
const $=id=>document.getElementById(id);
function state(q){return labels.queries[q.query_id]??={grades:{},constraint_judgments:{},overall_satisfied:{},allow_no_answer:false};}
function choice(parent,title,value,values,onchange){const label=document.createElement('label');label.className='clause';label.append(document.createTextNode(title));const select=document.createElement('select');for(const [val,text] of values){const option=document.createElement('option');option.value=val;option.textContent=text;select.append(option);}select.value=value===undefined?'':String(value);select.onchange=()=>{onchange(select.value);progress();};label.append(select);parent.append(label);}
const grades=[['','Chưa gán'],['0','0 · Không liên quan'],['1','1 · Một phần'],['2','2 · Phù hợp rõ']];const truths=[['','Chưa xem'],['true','Đúng'],['false','Sai'],['null','Không đủ bằng chứng']];
function progress(){let done=0;for(const q of DATA.queries)done+=Object.keys(state(q).grades).length;$('progress').textContent=`${done}/${DATA.queries.length*DATA.images.length} judgments · Không tự lưu; xuất bản nháp trước khi đóng trang.`;}
function render(){const q=DATA.queries[current],s=state(q);$('query').value=String(current);$('text').textContent=q.request.text??q.query_id;$('task').textContent=`${q.query_type} · ${q.language} · ${q.split} · nhóm ${q.group_id}`;$('noanswer').checked=s.allow_no_answer;$('noanswer').onchange=()=>s.allow_no_answer=$('noanswer').checked;$('images').replaceChildren();$('reference').replaceChildren();if(q.request.image_id){const ref=DATA.images.find(i=>i.image_id===q.request.image_id);const image=document.createElement('img');image.src=ref.preview;image.alt='Ảnh tham chiếu';image.height=160;$('reference').append('Ảnh tham chiếu: ',image);}for(const item of DATA.images){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src=item.preview;img.alt=item.image_id;card.append(img);const identity=document.createElement('small');identity.textContent=item.image_id+' · '+item.license;card.append(identity);choice(card,'Relevance',s.grades[item.image_id],grades,v=>{if(v==='')delete s.grades[item.image_id];else s.grades[item.image_id]=Number(v);});for(const clause of q.clauses){s.constraint_judgments[item.image_id]??={};choice(card,`${clause.id}: ${clause.negated?'KHÔNG ':''}${clause.text} (${clause.required?'bắt buộc':'ưu tiên'})`,s.constraint_judgments[item.image_id][clause.id],truths,v=>{if(v==='')delete s.constraint_judgments[item.image_id][clause.id];else s.constraint_judgments[item.image_id][clause.id]=JSON.parse(v);});}if(q.clauses.length)choice(card,'Ảnh thỏa toàn logic bắt buộc?',s.overall_satisfied[item.image_id],truths,v=>{if(v==='')delete s.overall_satisfied[item.image_id];else s.overall_satisfied[item.image_id]=JSON.parse(v);});$('images').append(card);}progress();}
function exportLabels(verified){try{labels.annotator=$('annotator').value.trim();labels.label_version=$('version').value.trim();if(verified){if(!labels.annotator||!labels.label_version||!$('confirm').checked)throw Error('Cần tên, phiên bản và xác nhận của người đánh giá.');for(const q of DATA.queries){const s=state(q);for(const image of DATA.images){if(s.grades[image.image_id]===undefined)throw Error('Thiếu grade: '+q.query_id);for(const c of q.clauses)if(s.constraint_judgments[image.image_id]?.[c.id]===undefined)throw Error('Thiếu constraint judgment: '+q.query_id);if(q.clauses.length&&s.overall_satisfied[image.image_id]===undefined)throw Error('Thiếu overall satisfaction: '+q.query_id);}if(!Object.values(s.grades).some(g=>g>=2)&&!s.allow_no_answer)throw Error('Cần xác nhận no-answer: '+q.query_id);}}labels.human_verified=verified;labels.exhaustive_judgments=verified;labels.reviewed_at_utc=new Date().toISOString();const blob=new Blob([JSON.stringify(labels,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`phase07_${verified?'verified':'draft'}_${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('message').textContent=verified?'Đã xuất nhãn do bạn xác nhận.':'Đã xuất bản nháp, chưa được dùng để đo quality.';}catch(e){$('message').textContent=e.message;}}
DATA.queries.forEach((q,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=q.query_id;$('query').append(option);});$('query').onchange=()=>{current=Number($('query').value);render();};$('previous').onclick=()=>{current=Math.max(0,current-1);render();};$('next').onclick=()=>{current=Math.min(DATA.queries.length-1,current+1);render();};$('draft').onclick=()=>exportLabels(false);$('verified').onclick=()=>exportLabels(true);$('import').onchange=async event=>{try{const candidate=JSON.parse(await event.target.files[0].text());if(candidate.dataset_sha256!==DATA.dataset_sha256||candidate.query_set_sha256!==DATA.query_set_sha256)throw Error('Snapshot/query set không khớp.');labels=candidate;$('annotator').value=labels.annotator??'';$('version').value=labels.label_version??'human-v1';$('confirm').checked=false;render();}catch(e){$('message').textContent=e.message;}};render();
</script></html>
