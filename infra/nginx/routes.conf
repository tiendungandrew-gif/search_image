root /usr/share/nginx/html;
index index.html;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'" always;

location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
location ~ /\. { deny all; }
# Administrative mutations remain available through the private operator CLI.
location = /api/v1/images {
    limit_except GET { deny all; }
    set $api_backend http://backend:8000;
    proxy_pass $api_backend;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
}
location ^~ /api/v1/index/ {
    limit_except GET { deny all; }
    set $api_backend http://backend:8000;
    proxy_pass $api_backend;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
}
location /api/ {
    set $api_backend http://backend:8000;
    proxy_pass $api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 70s;
    proxy_send_timeout 35s;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
}
location /assets/ { try_files $uri =404; expires 1y; }
location / { try_files $uri $uri/ /index.html; }
