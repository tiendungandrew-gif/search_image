[project]
name = "ai-image-search-backend"
version = "0.3.0"
description = "Nền tảng API cho AI Multimodal Image Search"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<0.29", "uvicorn>=0.34,<1", "minio>=7.2,<8",
  "qdrant-client>=1.14,<2", "anyio>=4.8,<5",
  "Pillow>=12,<13", "numpy>=2.2,<3", "python-multipart>=0.0.22,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]
ml = ["torch>=2.6,<3", "transformers>=4.57,<5", "safetensors>=0.6,<1", "py3langid==0.4.0"]
evaluation = ["matplotlib>=3.10,<4"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: yêu cầu PostgreSQL/Qdrant/MinIO thật, opt-in RUN_INTEGRATION=1"]
