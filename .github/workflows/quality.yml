name: Chất lượng phần mềm
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      real_model:
        description: Tải CLIP đã pin và chạy pipeline ảnh tổng hợp (tùy chọn)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12.12"}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "22.23.4", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install httpx==0.28.1
      - run: python scripts/deploy.py --env-file .env.ci init --project image-search-ci --release "ci-$GITHUB_SHA" --without-ml
      - run: python scripts/deploy.py --env-file .env.ci --evidence-dir docs/verification/phase12/runs validate
      - run: python scripts/deploy.py --env-file .env.ci --evidence-dir docs/verification/phase12/runs build
      - run: python scripts/deploy.py --env-file .env.ci --evidence-dir docs/verification/phase12/runs up
      - run: python scripts/administration/accounts.py bootstrap --env-file .env.ci --output .cache/auth/deployment-admin-login.json
      - run: python scripts/checks/verify_deployment.py --env-file .env.ci --expected-images 0
      - run: npm ci
        working-directory: frontend
      - run: PLAYWRIGHT_BROWSERS_PATH="$PWD/.cache/playwright" npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: python scripts/checks/check_deployment_browser.py --env-file .env.ci --project deploy-desktop
      - run: python scripts/deploy.py --env-file .env.ci --evidence-dir docs/verification/phase12/runs down
        if: always()
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with: {name: production-deployment, path: docs/verification/phase12, if-no-files-found: warn}
  backend-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12.12"}
      - run: python -m pip install uv==0.13.7
      - run: uv sync --project backend --frozen --extra dev --extra evaluation
      - run: backend/.venv/bin/ruff check backend scripts
      - run: backend/.venv/bin/python -m compileall -q backend/app backend/tests scripts
      - run: backend/.venv/bin/pytest backend/tests/unit backend/tests/security backend/tests/reliability -q --junitxml=.cache/qa-fast.xml
        env: {DEBUG: "false", PYTHONPATH: "backend:scripts"}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with: {name: backend-fast, path: .cache/qa-fast.xml, if-no-files-found: warn}
  frontend-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "22.23.4", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm install --global npm@11.21.1
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config playwright.mock.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with: {name: frontend-mock-results, path: frontend/test-results, if-no-files-found: warn}
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12.12"}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "22.23.4", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install httpx==0.28.1
      - run: python scripts/qa.py up
      - run: python scripts/qa.py services
      - run: npm ci
        working-directory: frontend
      - run: PLAYWRIGHT_BROWSERS_PATH="$PWD/.cache/playwright" npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: python scripts/qa.py browser
        env: {QA_BROWSER_PROJECT: qa-desktop}
      - run: python scripts/administration/accounts.py bootstrap --env-file .env.qa --output .cache/auth/qa-admin-login.json
      - run: python scripts/checks/check_access_browser.py --project access-desktop
      - run: python scripts/qa.py faults
      - run: python scripts/qa.py down
        if: always()
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with: {name: service-integration, path: docs/verification/phase11, if-no-files-found: warn}
  optional-real-model:
    if: github.event_name == 'workflow_dispatch' && inputs.real_model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12.12"}
      - run: python -m pip install uv==0.13.7
      - run: uv sync --project backend --frozen --extra dev --extra ml --extra evaluation
      - run: PYTHONPATH=backend backend/.venv/bin/python -m app.cli.download_model --output .cache/clip
      - run: python scripts/qa.py up --with-model
      - run: python scripts/qa.py ai
      - run: python scripts/qa.py down
        if: always()
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with: {name: optional-real-model, path: docs/verification/phase11, if-no-files-found: warn}
